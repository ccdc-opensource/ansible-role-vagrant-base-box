---
- name: Update yum packages  # noqa: package-latest
  ansible.builtin.yum:
    name: "*"
    state: latest
  when: ansible_os_family == "RedHat" and ansible_distribution_major_version == "7"
  become: true

- name: Update Rocky Linux 8 packages  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv:
      - dnf
      - -y
      - upgrade
  environment:
    LC_ALL: C
  register: rocky_8_dnf_update
  changed_when: "'Nothing to do.' not in rocky_8_dnf_update.stdout"
  when: ansible_distribution == "Rocky" and ansible_distribution_major_version == "8"
  become: true

- name: Update dnf packages  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version != "7"
    - not (ansible_distribution == "Rocky" and ansible_distribution_major_version == "8")
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true

- name: Update apt packages  # noqa: package-latest
  ansible.builtin.apt:
    name: "*"
    state: latest
  when: ansible_os_family == "Debian"
  become: true
